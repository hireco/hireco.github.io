<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人主页 · 姓名</title>
    <!-- 简洁的字体与图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* 全局重置与基础 */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #faf9f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            line-height: 1.6;
            color: #1e1e2a;
        }

        /* 主卡片 — 干净、柔和、留白 */
        .card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 2.5rem;
            padding: 3.5rem 3rem;
            box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.08),
                0 8px 24px -8px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.25s ease;
            text-align: center;
        }

        @media (max-width: 500px) {
            .card {
                padding: 2.5rem 1.5rem;
                border-radius: 1.8rem;
            }
        }

        /* 头像 — 柔和圆润，留白呼吸 */
        .avatar {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            background: #ececec;
            margin: 0 auto 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.25rem;
            font-weight: 400;
            color: #4a4a5a;
            background: #f0eeed;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.02);
            user-select: none;
            transition: transform 0.2s ease;
        }

        .avatar:hover {
            transform: scale(1.01);
        }

        /* 姓名 — 干净有重量 */
        .name {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #14141e;
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }

        @media (max-width: 500px) {
            .name {
                font-size: 2rem;
            }
        }

        /* 头衔 / 子标题 */
        .title {
            font-size: 1.1rem;
            font-weight: 400;
            color: #6b6b7a;
            margin-bottom: 1.5rem;
            letter-spacing: 0.01em;
        }

        /* 描述文字 — 温和、易读 */
        .bio {
            font-size: 1.05rem;
            color: #3a3a48;
            max-width: 480px;
            margin: 0 auto 2.25rem;
            line-height: 1.7;
            font-weight: 400;
        }

        .bio a {
            color: #1e1e2a;
            text-decoration: none;
            border-bottom: 1.5px dotted #c5c5d0;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .bio a:hover {
            border-bottom-color: #1e1e2a;
            color: #000;
        }

        /* 社交链接 — 干净、均匀 */
        .socials {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.75rem 1.25rem;
            margin-top: 0.5rem;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            border-radius: 60px;
            background: #f4f3f1;
            color: #1e1e2a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 450;
            transition: background 0.2s ease, transform 0.15s ease,
                box-shadow 0.2s ease;
            letter-spacing: -0.01em;
            border: 1px solid transparent;
        }

        .social-link i {
            font-size: 1.15rem;
            width: 1.2em;
            text-align: center;
            color: #3b3b4a;
            transition: color 0.2s ease;
        }

        .social-link:hover {
            background: #eae8e5;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.03);
            border-color: #d8d6d2;
        }

        .social-link:hover i {
            color: #14141e;
        }

        /* 极简 footer */
        .footer-note {
            margin-top: 2.8rem;
            font-size: 0.85rem;
            color: #9a9aa8;
            letter-spacing: 0.02em;
            border-top: 1px solid #f0eeec;
            padding-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .footer-note span {
            opacity: 0.7;
        }

        .footer-note a {
            color: #6b6b7a;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s, color 0.2s;
        }

        .footer-note a:hover {
            color: #1e1e2a;
            border-bottom-color: #c0c0cc;
        }

        /* 可选 — 很轻的装饰分隔 */
        .divider {
            width: 48px;
            height: 2px;
            background: #dedcd8;
            margin: 0.25rem auto 1.75rem;
            border-radius: 4px;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .social-link {
                padding: 0.45rem 0.9rem;
                font-size: 0.9rem;
            }
            .social-link i {
                font-size: 1rem;
            }
            .bio {
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- 头像 — 可换成图片或首字母 -->
        <div class="avatar" aria-label="头像">
            <i class="fas fa-user" style="font-size: 3.2rem; opacity: 0.6;"></i>
        </div>

        <!-- 姓名 -->
        <h1 class="name">张三</h1>

        <!-- 头衔 / 简短身份 -->
        <p class="title">设计师 · 创作者</p>

        <!-- 装饰细线 (可选) -->
        <div class="divider"></div>

        <!-- 个人简介 — 温暖、真实 -->
        <div class="bio">
            用设计 &amp; 代码搭建美好体验。
            目前专注 <a href="#">交互设计</a> 与 <a href="#">前端开发</a>。
            相信简单、有温度的作品。
        </div>

        <!-- 社交链接 — 可增删改 -->
        <div class="socials">
            <a href="#" class="social-link" aria-label="GitHub">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a href="#" class="social-link" aria-label="Twitter / X">
                <i class="fab fa-twitter"></i> Twitter
            </a>
            <a href="#" class="social-link" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i> LinkedIn
            </a>
            <a href="#" class="social-link" aria-label="Email">
                <i class="fas fa-envelope"></i> 邮件
            </a>
            <a href="#" class="social-link" aria-label="个人作品集">
                <i class="fas fa-briefcase"></i> 作品集
            </a>
        </div>

        <!-- 底部小信息 — 干净、克制 -->
        <div class="footer-note">
            <span>✦ 基于 GitHub Pages</span>
            <a href="#">· 订阅</a>
            <a href="#">· 简历</a>
        </div>

    </div>

</body>
</html>
