<script>

function randInt(m,n) {
  return Math.floor(Math.random()*(m-n+1)+n);
}

$(function(){

   function fixMenu() {
      $('body').append('<div class="mask"></div>');

	  $('.mainNav').removeClass('hidden-xs');
	  $('.sidePanel').addClass('fixed');

	  $('.mask').one('click',freeMenu);
   }

   function freeMenu() {
      $('.mainNav').addClass('hidden-xs');
	  $('.sidePanel').removeClass('fixed');

      $('.mask').unbind('click');
	  $('.mask').remove();
   }

   function loadPage() {

	   $('.mainContent').addClass('loading').empty();

	   let hash = window.location.hash;
	   hash = hash?hash:'home';

	   hash = hash.replace('#','').split('/');

		   $('.nav li').removeClass('active');
		   $('.nav a[href="#'+hash[0]+'"]').parent().addClass('active');
	   freeMenu();

	   let page = hash[0];

	   // 特殊处理：blog子页面（#blog/category, #blog/tag, #blog/archive）
	   if (hash.length > 1 && hash[0] === 'blog' && ['category','tag','archive'].indexOf(hash[1]) >= 0) {
		   page = hash[1];
	   }
	   // 特殊处理：blog页码（如 #blog/2）加载blog.html
	   else if (hash.length > 1 && hash[0] === 'blog' && /^\d+$/.test(hash[1])) {
		   page = 'blog';
	   }
	   // 特殊处理：archive年份（如 #year/2016）加载year.html
	   else if (hash.length > 1 && hash[0] === 'year' && /^\d{4}$/.test(hash[1])) {
		   page = 'year';
	   }
	   // view视图（如 #view/id）加载view.html
	   else if (hash.length > 1 && hash[0] === 'view') {
		   page = 'view';
	   }
	   else if (hash.length > 1) {
		   page = hash[1];
	   }

	   // 裸旧路由不再支持，直接404
	   if (hash.length === 1 && ["tag","category","archive","search"].indexOf(page) >= 0) page = "404";
	   let pages = ['404','home','project','blog','article','album','photo','about','tag','category','archive','search','contact','year','view','coolsites','download'];

	   if($.inArray( page, pages ) <= 0)  page = '404';

	   $.get( 'pages/' + page + '.html',function(data){
	      let pageHtml = $(data).not('.directAccess');
		  $('.mainContent').html(pageHtml).removeClass('loading');
	   });
   }

   loadPage();

   $.get('pages/audio.html', function(data) { $('.player').html(data); });

   window.onhashchange = function () {
	   loadPage();
   }

   $('.navbar-toggle').click(function(){

	  $('.mask').length ? freeMenu() : fixMenu();

   });


	   // 前进后退导航
	   var _navStack = [window.location.hash || "#home"];
	   var _navIdx = 0;

	   function _updateNavArrows() {
	     $(".nav-back").toggleClass("disabled", _navIdx <= 0);
	     $(".nav-forward").toggleClass("disabled", _navIdx >= _navStack.length - 1);
	   }

	   $(".nav-back").click(function() {
	     if (_navIdx > 0) { _navIdx--; window.location.hash = _navStack[_navIdx]; }
	   });

	   $(".nav-forward").click(function() {
	     if (_navIdx < _navStack.length - 1) { _navIdx++; window.location.hash = _navStack[_navIdx]; }
	   });

	   // 在hash变化前记录（实际记录在 loadPage 中更可靠）
	   var _origOnHashChange = window.onhashchange;
	   window.onhashchange = function() {
	     var newHash = window.location.hash || "#home";
	     if (_navStack[_navIdx] !== newHash) {
	       _navIdx++; _navStack = _navStack.slice(0, _navIdx);
	       _navStack.push(newHash);
	     }
	     _updateNavArrows();
	     if (_origOnHashChange) _origOnHashChange();
	   };

	   _updateNavArrows();
   // Desktop search toggle
   $('.searchForm .glyphicon-search').click(function(){
     $('.searchForm .form-control,.searchForm .glyphicon-search').toggleClass('hidden');
   });

   // Mobile search toggle
   $('.mobile-search-icon').click(function(){
     $('.mobile-search-dropdown').toggle();
     if ($('.mobile-search-dropdown').is(':visible')) {
       freeMenu();
       $('body').append('<div class="mask mobile-search-mask"></div>');
       $('#mobile-search-input').focus();
       $('.mobile-search-mask').one('click', function(){
         $('.mobile-search-dropdown').hide();
         $(this).remove();
       });
     } else {
       $('.mobile-search-mask').remove();
     }
   });

   // Search submit (both desktop and mobile)
   $('.searchForm .form-control, #mobile-search-input').bind('blur keydown', function(event){
     if(event.type=='blur' || event.which==13) {
       var query = $(this).val();
       if(!query) {
         if ($(this).is('#mobile-search-input')) {
           $('.mobile-search-dropdown').hide();
           $('.mobile-search-mask').remove();
         } else {
           $('.searchForm .form-control,.searchForm .glyphicon-search').toggleClass('hidden');
         }
       } else {
         window.location.hash='#blog/search/'+query;
         $(this).val('');
         $('.mobile-search-dropdown').hide();
         $('.mobile-search-mask').remove();
       }
     }
   });
});
</script>
