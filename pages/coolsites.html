<script class="directAccess" src="../directAccess.js"></script>

<div class="page-title">
  <div><span class="glyphicon glyphicon-globe"></span> 酷站分享</div>
</div>

<div class="coolsites-container hidden">
  <div class="coolsites-grid"></div>
</div>
<div class="noEntryFound">
  <span class="glyphicon glyphicon-info-sign"></span>
  <span>暂无酷站推荐</span>
</div>

<style>
.coolsites-container {
  padding: 10px 0;
}
.coolsites-container.hidden {
  display: none;
}
.coolsites-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.coolsite-card {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  position: relative;
}
.coolsite-card:hover {
  transform: translateY(-3px);
  border-color: rgba(255, 255, 255, 0.15);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.coolsite-logo {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  object-fit: contain;
  background: rgba(255, 255, 255, 0.10);
  flex-shrink: 0;
}
.coolsite-info {
  flex: 1;
  min-width: 0;
}
.coolsite-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 4px;
  line-height: 1.3;
}
.coolsite-name a {
  color: #64b5f6;
  text-decoration: none;
}
.coolsite-name a:hover {
  color: #90caf9;
  text-decoration: underline;
}
.coolsite-desc {
  font-size: 13px;
  color: #aaa;
  line-height: 1.5;
  margin-bottom: 6px;
}
.coolsite-recommend {
  position: absolute;
  top: 10px;
  right: 10px;
  color: #f9a825;
  font-size: 16px;
}
.coolsite-recommend i {
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
}
@media (max-width: 768px) {
  .coolsites-grid {
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
}
</style>

<script>
$(function(){
  $.ajax({
    type: 'get',
    dataType: 'json',
    cache: false,
    url: 'data/coolsite.json',
    success: function(data) {
      var sites = data || [];
      if (sites.length === 0) {
        $('.noEntryFound').show();
        return;
      }

      // 按sort排序，推荐优先
      sites.sort(function(a, b) {
        if ((a.recommended && !b.recommended)) return -1;
        if ((!a.recommended && b.recommended)) return 1;
        return (a.sort || 999) - (b.sort || 999);
      });

      var $grid = $('.coolsites-grid');
      $grid.empty();

      sites.forEach(function(site) {
        var logoUrl = '';
        if (site.logo) {
          if (site.logo.indexOf('coolsites/') === 0) {
            logoUrl = site.logo;
          } else if (/^https?:\/\//.test(site.logo)) {
            logoUrl = site.logo;
          } else {
            logoUrl = site.logo;
          }
        }

        var logoHtml = logoUrl
          ? '<img src="' + logoUrl + '" alt="' + (site.name || '') + '" class="coolsite-logo" loading="lazy" decoding="async" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22><rect fill=%22%23eee%22 width=%2256%22 height=%2256%22 rx=%2212%22/><text x=%2228%22 y=%2234%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2218%22>\' + ((this.alt || \'?\')[0] || \'?\') + \'</text></svg>\'">'
          : '<div class="coolsite-logo" style="display:flex;align-items:center;justify-content:center;font-size:24px;color:#999;background:#f5f5f5;">' + (site.name || '?')[0] + '</div>';

        var recommendBadge = site.recommended
          ? '<span class="coolsite-recommend" title="推荐"><i class="glyphicon glyphicon-star"></i></span>'
          : '';

        $grid.append(
          '<div class="coolsite-card">' +
            logoHtml +
            '<div class="coolsite-info">' +
              '<div class="coolsite-name"><a href="' + (site.url || '#') + '" target="_blank" rel="noopener">' + (site.name || '未命名') + '</a></div>' +
              (site.description ? '<div class="coolsite-desc">' + site.description + '</div>' : '') +
            '</div>' +
            recommendBadge +
          '</div>'
        );
      });

      $('.coolsites-container').removeClass('hidden');
    },
    error: function() {
      $('.noEntryFound').show();
    }
  });
});
</script>
