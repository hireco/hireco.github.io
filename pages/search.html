<script class="directAccess" src="../directAccess.js"></script>

<div class="page-title">
  <div><span class="glyphicon glyphicon-search"></span> 搜索结果<span class="search-keyword"></span></div>
</div>

<div class="blog hidden"></div>
<div class="blog-pagination hidden">
  <button class="page-btn prev" onclick="changePage(-1)">上一页</button>
  <span class="page-info">第 <span class="current-page">1</span> / <span class="total-pages">1</span> 页</span>
  <button class="page-btn next" onclick="changePage(1)">下一页</button>
</div>
<div class="noEntryFound">
  <span class="glyphicon glyphicon-info-sign"></span>
  <span>未找到匹配的文章</span>
</div>

<script>

$(function(){

  var currentPage = 1;
  var itemsPerPage = 8;
  var searchKeyword = '';
  var filteredResults = [];

  var hash = window.location.hash.split('/');

  if (!hash[2]) {
    window.location.hash = '404';
    return;
  }

  searchKeyword = decodeURIComponent(hash[2]);

  // Determine initial page from hash (#blog/search/keyword/2)
  if (hash[3] && /^\d+$/.test(hash[3])) {
    currentPage = parseInt(hash[3], 10) || 1;
  }

  $('.search-keyword').text(': ' + searchKeyword);

  function updateUrl(page) {
    var newHash = page > 1
      ? '#blog/search/' + encodeURIComponent(searchKeyword) + '/' + page
      : '#blog/search/' + encodeURIComponent(searchKeyword);
    history.replaceState(null, '', newHash);
  }

  function renderPage(filtered) {
    var $blog = $('.blog');
    $blog.empty();

    var totalPages = Math.ceil(filtered.length / itemsPerPage);
    if (totalPages < 1) totalPages = 1;

    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    $('.current-page').text(currentPage);
    $('.total-pages').text(totalPages);

    var startIndex = (currentPage - 1) * itemsPerPage;
    var endIndex = Math.min(startIndex + itemsPerPage, filtered.length);

    for (var i = startIndex; i < endIndex; i++) {
      var item = filtered[i];
      $blog.append('<div><h4><a href="#blog/article/' + item.id.toLowerCase() + '">' + item.topic + '</a> <small><i>' + item.date + '</i></small></h4><p>' + item.abstract + '</p></div>');
    }

    $('.page-btn.prev').prop('disabled', currentPage <= 1);
    $('.page-btn.next').prop('disabled', currentPage >= totalPages);

    if (filtered.length > 0) {
      $('.blog').removeClass('hidden');
      $('.blog-pagination').removeClass('hidden');
      $('.noEntryFound').hide();
    } else {
      $('.noEntryFound').show();
    }
  }

  window.changePage = function(direction) {
    var totalPages = Math.ceil(filteredResults.length / itemsPerPage);
    if (totalPages < 1) totalPages = 1;
    var newPage = currentPage + direction;

    if (newPage >= 1 && newPage <= totalPages) {
      currentPage = newPage;
      updateUrl(currentPage);
      renderPage(filteredResults);
    }
  };

  // Listen for hash change to navigate pages via browser back/forward
  window.addEventListener('hashchange', function() {
    var h = window.location.hash.split('/');
    if (h[3] && /^\d+$/.test(h[3])) {
      var page = parseInt(h[3], 10) || 1;
      if (page !== currentPage) {
        currentPage = page;
        renderPage(filteredResults);
      }
    }
  });

  // Keyboard navigation
  $(document).off('keydown.search').on('keydown.search', function(e) {
    if ($('.blog').is(':visible') && !$('input, textarea').is(':focus')) {
      if (e.key === 'ArrowLeft') changePage(-1);
      if (e.key === 'ArrowRight') changePage(1);
    }
  });

  // Load data and filter
  try {
    doSearch(articles);
  } catch(err) {
    $.getJSON('data/blog.json', function(data) {
      doSearch(data || []);
    });
  }

  function doSearch(data) {
    var kw = searchKeyword.toLowerCase();
    filteredResults = (data || []).filter(function(item) {
      if (item.visible === false) return false;
      var haystack = [item.abstract || '', (item.tags || []).join(' ')].join(' ');
      return haystack.toLowerCase().indexOf(kw) >= 0;
    });

    renderPage(filteredResults);
  }
});

</script>
