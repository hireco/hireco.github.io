<script class="directAccess" src="../directAccess.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4/fonts/remixicon.css">

<div class="page-title" style="display: flex; justify-content: space-between; align-items: flex-start;">
  <div><span class="glyphicon glyphicon-download-alt"></span> 资料下载</div>
  <div class="download-actions">
    <a href="javascript:void(0)" onclick="showDonate()"><i class="ri-hand-heart-line"></i> 打赏</a>
    <a href="javascript:void(0)" id="logout-btn" onclick="logout()" style="display:none;"><i class="ri-logout-box-r-line"></i> 退出</a>
  </div>
</div>

<div id="login-box" class="download-card download-login" style="display:none;">
  <div class="download-lock-icon">
    <i class="ri-lock-password-line"></i>
  </div>
  <h2 class="download-login-title">文件下载中心</h2>
  <p class="download-login-subtitle">输入访问密码解锁内容</p>

  <div class="download-input-wrap">
    <input type="password" id="pwd-input" placeholder="请输入访问密码" autocomplete="new-password">
  </div>

  <button class="download-submit-btn" onclick="checkPassword()">
    <i class="ri-shield-check-line"></i>
    <span>解锁进入</span>
  </button>

  <div id="error-msg" class="download-error-msg">
    <i class="ri-error-warning-line"></i> 密码错误，请重试
  </div>

  <div class="download-divider">
    <span>扫码获取密码</span>
  </div>

  <div class="download-wechat">
    <img src="download/images/erweima.jpg" alt="微信公众号二维码">
    <p>关注后发送 <strong>"下载密码"</strong></p>
  </div>
</div>

<div id="main-content" class="download-card download-main">
  <div class="download-main-header">
    <h1><i class="ri-download-cloud-2-line"></i> 文件下载中心</h1>
    <p>所有资源均可免费下载</p>
  </div>
  <div class="download-main-body">
    <div class="download-breadcrumb">
      <i class="ri-folder-line"></i>
      <span id="breadcrumb-text">当前位置: /</span>
    </div>
    <ul id="file-list" class="file-list">
      <li class="download-loading"><i class="ri-loader-4-line"></i><br>正在加载...</li>
    </ul>
  </div>
</div>

<div id="donate-modal" class="download-modal-overlay">
  <div class="download-modal-card">
    <button class="download-modal-close" onclick="closeDonate()">&times;</button>
    <div class="download-modal-title">
      <i class="ri-hand-heart-line"></i> 打赏支持
    </div>
    <img src="download/images/donateMe.png" alt="微信赞赏" width="200" height="200">
    <p>感谢您的支持</p>
  </div>
</div>

<script>
if (typeof checkPassword === 'undefined') {
  $.getScript('download/js/main.js', function() {
    loadFiles = async function() {
      var listEl = document.getElementById('file-list');
      if (!listEl) return;
      if (filesData) { loadPath(rootPath); return; }
      listEl.innerHTML = '<li class="download-loading"><i class="ri-loader-4-line"></i><br>正在加载...</li>';
      try {
        var resp = await fetch('data/files.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        filesData = normalize(await resp.json());
        rootPath = filesData.path;
        loadPath(rootPath);
      } catch (e) {
        listEl.innerHTML = '<li class="download-error"><i class="ri-error-warning-line"></i> 加载文件列表失败: ' + e.message + '</li>';
      }
    };
    initAuth();
  });
} else {
  var pwdInput = document.getElementById('pwd-input');
  if (pwdInput) {
    pwdInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  }
  initAuth();
}
</script>
